# ==========================================================
# Sistema de Venta - configuracion de aplicacion
# ==========================================================
# Este archivo se procesa con filtrado de Maven para mantener
# ${project.version} sincronizada con el POM.
#
# NOTA (PROJECT_SPEC.md - Seguridad): las credenciales de base de datos
# NO van aqui. Se resolveran en la Fase 3 mediante un archivo externo
# (application-local.properties) fuera del control de versiones.

app.name=Sistema de Venta
app.version=${project.version}
app.organization=py.com.sistemaventa

# ---- Ventana principal ----
window.title=Sistema de Venta
window.width=960
window.height=640
window.resizable=true

# ---- Logging ----
# Uno de: TRACE, DEBUG, INFO, WARN, ERROR
logging.level=INFO
logging.directory=logs

# ---- Directorio de datos de la aplicacion ----
# Relativo al directorio home del usuario del sistema operativo.
app.data.directory=.sistemaventa
